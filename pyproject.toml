[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "new-gen-local-ai"
version = "0.1.0"
description = "Triple-Stack Compressed Local Coding Agent (30B-35B MoE + Unsloth Dynamic 2.0 + TurboQuant KV + Compound AI)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "IsLSteven" }
]
keywords = ["local-ai", "coding-agent", "llm-compression", "turboquant", "unsloth", "qwen3-coder", "moe", "llama-cpp"]
dependencies = [
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "rich>=13.7.0",
    "prompt-toolkit>=3.0.47",
    "psutil>=6.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
nglai = "nglai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nglai = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.cache/pytest_tmp"
